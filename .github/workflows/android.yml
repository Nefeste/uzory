# из anamnez: .github/workflows/android.yml @ 3d76cf5
# Проверки, веб-сценарий, сборка APK, подписанного постоянным ключом (ADR 0014), и
# публикация в Releases (docs/05-process.md, «Автоматика»).
#
# Сам — только на тег версии vX.Y.Z (устав студии, ADR 0019): слияние в main сборку не
# запускает, проверки на PR — в pr.yml. Тег ставится на коммит main с этой версией в
# app.json; релиз — на этот тег. Ручного запуска нет (решение владельца 03.10.2026): APK —
# только на тег. AAB не собирается, пока нет Google Play (решение владельца 03.10.2026);
# вернуть — второй строкой матрицы в задании «Ключ подписи» (target aab, задача Gradle для
# бандла): шаги сборки, проверок и релиза AAB понимают.
#
# Без секретов ключа релиза нет никогда: APK собирается только на проверку (манифест,
# разрешения, 16 КБ, размер) и выбрасывается — файл с отладочной подписью не должен
# попасть ни на чей телефон.
name: Android

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# тег собирается до конца
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Проверки
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm ci
      - name: Картинки — сборка и проверки
        run: bun tools/content/build.ts
      - name: Типы приложения
        run: npx tsc --noEmit
      - name: Типы инструментов и тестов
        run: npx tsc --noEmit -p tools
      - name: Линтер
        run: npm run lint
      - name: Тесты
        run: bun test tools/test
      - name: Отчёт сборки картинок
        if: always()
        run: test -f dist/report.md && cat dist/report.md >> "$GITHUB_STEP_SUMMARY" || true

  # Веб-сборка и сценарий Playwright (docs/06-testing.md, §5) от корня — стенд проверок. Сборку
  # для папки /uzory/test (закрытая веб-версия, docs/specs/2026-09-web.md) и сценарий на ней
  # гоняет site.yml перед каждой выкладкой на сайт: в APK её нет, а второй прогон здесь — ещё
  # 4,5 минуты и ещё один повод упасть.
  web:
    name: Веб-сборка и сценарий
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm ci
      - run: bun tools/content/build.ts
      - run: npm run export:web
      - name: Chromium для Playwright
        run: npx playwright install --with-deps chromium
      - name: Сценарий
        run: bun tools/e2e/smoke.ts
      # снимки сценария — с картинками «только для проверки»: артефакты открытого репозитория
      # скачивает кто угодно, поэтому снимки выкладываются, только когда репозиторий закрыт.
      # И только когда сценарий упал, на неделю: место под артефакты общее на все закрытые
      # репозитории аккаунта и в октябре 2026 кончилось (docs/05-process.md, «Место под
      # артефакты»). Не выгрузились — не беда: задание уже красное, а снимки сценарий пишет и
      # локально (tools/e2e/out/).
      - uses: actions/upload-artifact@v4
        if: failure() && github.event.repository.private
        continue-on-error: true
        with:
          name: screens-${{ github.run_number }}
          path: tools/e2e/out/
          if-no-files-found: ignore
          retention-days: 7

  # Есть ли постоянный ключ — решается один раз, до сборок: от этого зависит, что собирать.
  key:
    name: Ключ подписи
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.k.outputs.ready }}
      build: ${{ steps.k.outputs.build }}
      matrix: ${{ steps.k.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: app.json
          sparse-checkout-cone-mode: false
      # тег — ровно версия коммита: иначе релиз с чужим номером, а Gradle — зря. Точка после «v»
      # (v.0.14.2 — так тег поставили 04.10.2026) — та же версия
      - name: Тег и версия
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="$(node -p "require('./app.json').expo.version")"
          T="${TAG#v}"; T="${T#.}"
          if [ "$T" != "$V" ]; then echo "::error::Тег $TAG — это версия $T, а в app.json этого коммита — $V. Тег ставится на коммит main с версией $V: v$V."; exit 1; fi
          echo "Тег $TAG — версия $V"
      # С 1.0.0 сборка идёт в магазин (store/release.md): без оплаты RuStore и без постоянного ключа она
      # не собирается вовсе — в RuStore не уйдёт «подписка не продаётся» или файл, который не выкладывается.
      # Сборки 0.Y.Z — для проверки, им можно и то и другое. Так же в «Нардах» с их 1.0.0 (23.10.2026).
      - name: Выпуск в магазин — оплата RuStore и постоянный ключ
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APP_ID: ${{ vars.RUSTORE_APP_ID }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          V="$(node -p "require('./app.json').expo.version")"
          case "$V" in 0.*) echo "Версия $V — сборка для проверки: без RuStore Pay и без ключа — можно."; exit 0 ;; esac
          bad=0
          printf '%s' "$APP_ID" | grep -qE '^[0-9]+$' || { echo "::error::Переменная RUSTORE_APP_ID — номер приложения в консоли RuStore (цифры): без него в выпуске подписку не купить."; bad=1; }
          [ "$HAS_KEY" = "true" ] || { echo "::error::Секреты постоянного ключа заданы не все (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD): в магазин — только им (ADR 0014)."; bad=1; }
          [ -n "$CERT" ] || { echo "::error::Нет переменной ANDROID_CERT_SHA256: отпечаток постоянного ключа сверяется на готовом APK."; bad=1; }
          [ "$bad" = 0 ] && echo "Версия $V — выпуск в магазин: номер приложения RuStore и постоянный ключ на месте."
          exit "$bad"
      - id: k
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT: ${{ vars.ANDROID_CERT_SHA256 }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          # сборка — только на тег версии
          if [ "$TAG" = "true" ]; then BUILD=yes; else BUILD=no; fi
          APK='{"target":"apk","task":"assembleRelease","file":"android/app/build/outputs/apk/release/app-release.apk"}'
          if [ -z "$KEYSTORE_B64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[$APK]}" >> "$GITHUB_OUTPUT"
            echo "build=$BUILD" >> "$GITHUB_OUTPUT"
            echo "::warning::Секретов ключа подписи нет: APK для телефона не будет. Как завести ключ — docs/05-process.md, «Секреты»."
            exit 0
          fi
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Секреты ключа заданы не все: нужны ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS и ANDROID_KEY_PASSWORD."
            exit 1
          fi
          if [ -z "$CERT" ]; then
            echo "::error::Ключ есть, а переменной репозитория ANDROID_CERT_SHA256 нет — не с чем сверить подпись. Отпечаток: keytool -list -v -keystore uzory-release.jks -alias uzory | grep SHA256"
            exit 1
          fi
          echo "ready=yes" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":[$APK]}" >> "$GITHUB_OUTPUT"

  # Матрица сборок: сейчас только APK (Releases и RuStore). AAB, если вернётся, — вторая сборка
  # из того же коммита, параллельно: Gradle не считает переменные окружения входом сборки JS.
  build:
    name: Сборка ${{ matrix.target }}
    needs: [key]
    if: needs.key.outputs.build == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Номер приложения в консоли RuStore (переменная репозитория, не секрет) — как в «Нардах»: нужен
    # и prebuild (плагин набора @gornitsa/kit/rustore-pay/plugin), и сборке JS (src/state/billing.ts), поэтому — на всё
    # задание. Нет переменной — RuStore Pay в сборку не входит и покупок в ней нет
    # (docs/specs/2026-09-plus.md, «Что изменилось», 20.10.2026).
    env:
      EXPO_PUBLIC_RUSTORE_APP_ID: ${{ vars.RUSTORE_APP_ID || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.key.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      # Бандл JS берёт встроенный набор из src/content/generated — его собирает сборка картинок.
      # Релиз видит кто угодно, поэтому в нём — только картинки и пьесы с «да» владельца и
      # правами (--release; docs/09-content.md). Нет ни одной картинки с «да» — сборка картинок
      # останавливается: пустое приложение не собирается.
      - name: Встроенный набор
        run: |
          echo "Только картинки и пьесы с «да» владельца и правами (--release)." | tee -a "$GITHUB_STEP_SUMMARY"
          bun tools/content/build.ts --release
      - name: Нативный проект (expo prebuild)
        run: npx expo prebuild --platform android --no-install
      - name: Больше памяти Gradle
        run: printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> android/gradle.properties

      # Ключ, подпись и содержимое — действия общего набора студии (ADR студии 0022):
      # Nefeste/gornitsa-kit, actions/android-*. Секретов нет — подпись отладочная, релиза нет.
      - id: keystore
        if: needs.key.outputs.ready == 'yes'
        uses: Nefeste/gornitsa-kit/actions/android-keystore@v1
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          gradle-prefix: UZORY

      - name: Сборка ${{ matrix.target }}
        working-directory: android
        env:
          NODE_ENV: production
          ORG_GRADLE_PROJECT_UZORY_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_UZORY_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_UZORY_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Две архитектуры: у аудитории бывают недорогие 32-битные телефоны (docs/02-architecture.md,
        # «Сборка приложения»); доля и размер — вопрос прототипа П1.
        run: ./gradlew ${{ matrix.task }} --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # Подпись проверяется на готовом файле, а не по настройкам. Отпечаток постоянного ключа
      # закреплён переменной ANDROID_CERT_SHA256 — чужой ключ в секретах остановит сборку.
      # Файл ключа после сборки удаляется.
      - name: Подпись
        id: cert
        uses: Nefeste/gornitsa-kit/actions/android-signature@v1
        with:
          file: ${{ matrix.file }}
          expected: ${{ vars.ANDROID_CERT_SHA256 }}
          permanent: ${{ steps.keystore.outputs.permanent || 'no' }}
          keystore-file: ${{ steps.keystore.outputs.file }}

      # Что внутри (docs/06-testing.md, §7): 16 КБ, разрешения ровно по белому списку
      # .github/apk-permissions.txt, запретные разрешения студии (их нет в политике
      # конфиденциальности) и «Узоров» (READ_MEDIA, FOREGROUND_SERVICE, INSTALL_REFERRER,
      # WAKE_LOCK), резервная копия включена — работы переживают переустановку
      # (docs/04-data-model.md), размер не больше 90 МБ (docs/02-architecture.md, «Ограничения»).
      # Нужное разрешение — в белый список, в docs/05-process.md и в политику
      # конфиденциальности; ненужное — в blockedPermissions в app.json.
      - name: Содержимое
        uses: Nefeste/gornitsa-kit/actions/android-contents@v1
        with:
          file: ${{ matrix.file }}
          allow-file: .github/apk-permissions.txt
          forbid: 'READ_MEDIA|FOREGROUND_SERVICE|INSTALL_REFERRER|WAKE_LOCK'
          backup: 'on'
          max-size-mb: '90'

      # Своё «Узоров», чего нет в наборе: ровно две архитектуры, как заказано сборке, и
      # RuStore Pay в манифесте ровно тогда, когда задана переменная RUSTORE_APP_ID
      # (плагин набора @gornitsa/kit/rustore-pay/plugin); без неё покупок в сборке нет.
      - name: Содержимое — архитектуры и RuStore Pay
        env:
          FILE: ${{ matrix.file }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -n1)"
          # ровно две архитектуры, как заказано сборке (у AAB библиотеки — в base/lib)
          ARCHS="$(unzip -Z1 "$FILE" | sed -nE 's#^(base/)?lib/([^/]+)/.+#\2#p' | sort -u | paste -sd ' ')"
          if [ "$ARCHS" != "arm64-v8a armeabi-v7a" ]; then echo "::error::Архитектуры: $ARCHS, а нужно arm64-v8a и armeabi-v7a"; exit 1; fi
          echo "Архитектуры: $ARCHS"

          if [ "$TARGET" = "apk" ]; then
            # номер приложения в манифесте есть ровно тогда, когда задана переменная RUSTORE_APP_ID
            # (без конвейера в grep -q: под pipefail обрыв printf выглядел бы как «не нашлось»)
            PAY="$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$FILE" | grep -A2 'console_app_id_value' || true)"
            if [ -n "$EXPO_PUBLIC_RUSTORE_APP_ID" ]; then
              if [ -z "$PAY" ]; then echo "::error::RUSTORE_APP_ID задан, а RuStore Pay в манифест не встал (@gornitsa/kit/rustore-pay/plugin)."; exit 1; fi
              case "$PAY" in *"$EXPO_PUBLIC_RUSTORE_APP_ID"*) ;; *) echo "$PAY"; echo "::warning::Номер приложения RuStore в манифесте не прочитался как $EXPO_PUBLIC_RUSTORE_APP_ID — сверьте вывод aapt2 выше." ;; esac
              echo "- RuStore Pay: есть, приложение $EXPO_PUBLIC_RUSTORE_APP_ID — подписка «Узоры+» покупается" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              if [ -n "$PAY" ]; then echo "::error::RUSTORE_APP_ID не задан, а RuStore Pay в манифесте есть."; exit 1; fi
              echo "- RuStore Pay: нет (переменной RUSTORE_APP_ID нет) — покупок в сборке нет" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Собрать
        if: needs.key.outputs.ready == 'yes'
        env:
          FILE: ${{ matrix.file }}
          TARGET: ${{ matrix.target }}
          LABEL: ${{ steps.cert.outputs.label }}
          SHA: ${{ steps.cert.outputs.sha256 }}
        run: |
          mkdir -p dist
          cp "$FILE" "dist/uzory-${{ github.run_number }}.$TARGET"
          printf '%s\n%s\n' "$LABEL" "$SHA" > "dist/signature-$TARGET.txt"
          ls -la dist

      # Файлы — заданию «Релиз» через кэш Actions, а не артефактом (docs/05-process.md, «Место
      # под артефакты»): кэш в это место не входит. Ключ — своя строка матрицы и прогон.
      - uses: actions/cache/save@v4
        if: needs.key.outputs.ready == 'yes'
        with:
          path: dist
          key: dist-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Одна публикация на обе сборки — только на тег версии: релиз «vX.Y.Z» на этот тег с разделом
  # версии из README. Не пре-релиз и последний: на странице репозитория — ссылка на него с пометкой
  # Latest, а не «26 tags» (решение владельца 14.10.2026; пре-релиз последним не бывает).
  release:
    name: Релиз
    needs: [checks, web, key, build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.key.outputs.ready == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: repo
          sparse-checkout: |
            app.json
            README.md
          sparse-checkout-cone-mode: false
      # Те файлы, что собраны и проверены выше, — по ключу на строку матрицы. Путь — тот же, что
      # при сохранении (он входит в версию кэша); перезапуск одного «Релиза» берёт сборку прежней
      # попытки. AAB — только если его вернули в матрицу (шапка файла); тогда без него релиза нет.
      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-apk-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dist-apk-${{ github.run_id }}-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        if: contains(needs.key.outputs.matrix, '"target":"aab"')
        with:
          path: dist
          key: dist-aab-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dist-aab-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: Подпись
        id: sig
        run: |
          ls -la dist
          echo "label=$(sed -n 1p dist/signature-apk.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=$(sed -n 2p dist/signature-apk.txt)" >> "$GITHUB_OUTPUT"
      - name: Заметки релиза
        id: ver
        env:
          PAY_ID: ${{ vars.RUSTORE_APP_ID || '' }}
        run: |
          V=$(node -p "require('./repo/app.json').expo.version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # «Что нового» — раздел «### X.Y.Z …» из «## Версии» README, до следующего заголовка
          awk -v v="$V" 'index($0, "### " v) == 1 { on = 1; next } on && /^##/ { exit } on' repo/README.md > notes.md
          {
            cat notes.md
            echo
            echo "---"
            echo "**uzory-${{ github.run_number }}.apk** — для телефона: скачайте и откройте. Этот же файл — для RuStore."
            if compgen -G 'dist/*.aab' > /dev/null; then
              echo "**uzory-${{ github.run_number }}.aab** — только для загрузки в магазины, принимающие AAB (на телефон не ставится)."
            fi
            echo "Подписаны ${{ steps.sig.outputs.label }}, SHA-256 сертификата: \`${{ steps.sig.outputs.sha }}\`."
            if [ -n "$PAY_ID" ]; then
              echo "Подписка «Узоры+» — через RuStore Pay (приложение $PAY_ID в консоли RuStore)."
            else
              echo "Покупок в этой сборке нет: не задана переменная RUSTORE_APP_ID."
            fi
            # с 1.0.0 — файл для RuStore: номер приложения и ключ проверило задание «Ключ подписи»
            case "$V" in 0.*) ;; *) echo "Выпуск для RuStore: первую версию — в консоль руками, следующие — workflow «RuStore»; на модерацию — после проверки на телефоне (store/release.md)." ;; esac
            echo "Собрано из коммита ${{ github.sha }} (тег ${{ github.ref_name }}), сборка ${{ github.run_number }}."
          } > release.md
          cat release.md
      - name: Релиз ${{ github.ref_name }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
