# Выкладывает APK из релиза версии (тег vX.Y.Z, android.yml) в черновик новой версии RuStore
# (docs/05-process.md, «Выпуск версии»). Логика — в общем наборе студии (ADR студии 0022):
# Nefeste/gornitsa-kit, workflow rustore.yml.
# Запускается только руками: Actions → RuStore → Run workflow. На модерацию черновик уходит,
# только если отмечено «submit»; иначе владелец проверяет его в консоли и отправляет сам.
# Без тега — последний релиз без черновиков; пре-релизы тоже годятся (`prereleases: true`),
# как было до набора.
#
# Нужны секрет RUSTORE_API_TOKEN (приватный ключ из «API RuStore» в консоли) и переменная
# или секрет RUSTORE_KEY_ID (номер этого ключа из таблицы ключей). Первую версию приложения
# RuStore принимает только через консоль — этот запуск для второй и следующих.
name: RuStore

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза vX.Y.Z (пусто — последний)'
        required: false
        default: ''
      submit:
        description: 'Сразу отправить на модерацию'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    uses: Nefeste/gornitsa-kit/.github/workflows/rustore.yml@v1
    with:
      package: games.gornitsa.uzory
      apk: 'uzory-*.apk'
      tag: ${{ inputs.tag }}
      prereleases: true
      submit: ${{ inputs.submit }}
      key-id: ${{ vars.RUSTORE_KEY_ID }}
    secrets:
      RUSTORE_API_TOKEN: ${{ secrets.RUSTORE_API_TOKEN }}
      RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
