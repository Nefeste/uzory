# Наборы картинок на сервере (docs/05-process.md, «Выкладывание наборов»; docs/specs/2026-09-packs.md).
#
# Раз в сутки, если main ушёл вперёд от прошлого успешного запуска, и вручную — tools/content/week.ts.
# Не на push в main: слияние автослиянием (GITHUB_TOKEN) workflow на push не запускает
# (docs/05-process.md, «Ветки»). Что делает:
# - золотой тест: картинки, уже выложенные на сервер, собираются в те же клетки и нити (иначе —
#   поднять v в карточке); пока на сервере каталога нет, сверять не с чем — запуск это пишет
#   и заканчивается, ничего не собирая;
# - если в content/week.yaml ещё не выпущенный id — набор недели и новый каталог, подписанный
#   CATALOG_SIGNING_KEY, и выкладка — в ветку packs этого репозитория: все выложенные наборы
#   (выложенный набор не меняется никогда), подпись и каталог — одним коммитом без истории, как
#   ветка vps веб-версии. Сервер сайта забирает её сам раз в 5 минут (deploy/uzory в репозитории
#   Nefeste/gornitsagames): сверяет подпись и наборы, кладёт сначала наборы, потом подпись и каталог
#   в /srv/gornitsa/uzory/v1/; затем всё скачивается обратно с сайта и сверяется;
# - скрипт свёртки журнала каталога (server/stats/fold.ts) — в ту же ветку (stats/fold.ts).
# Руками (Actions → Content → Run workflow, только main): «base» — первый каталог со встроенным
# набором этой версии, один раз к выпуску 1.0.
#
# Нужен секрет CATALOG_SIGNING_KEY (В18). Входа на сервер у CI нет и не нужно (В9, 02.11.2026):
# сервер сам забирает ветку, как веб-версию. Откат — прежний каталог из артефактов запуска в ветку
# packs (наборы не удаляются никогда).
name: Content

on:
  schedule:
    - cron: '41 1 * * *'   # 04:41 по Москве
  workflow_dispatch:
    inputs:
      base:
        description: 'Первый каталог: встроенный набор этой версии (один раз, к выпуску 1.0)'
        type: boolean
        default: false

permissions:
  contents: write   # ветка packs
  actions: read

# выкладки идут по одной и не прерывают друг друга
concurrency:
  group: content-packs
  cancel-in-progress: false

env:
  V1: https://gornitsa.games/uzory/v1/

jobs:
  packs:
    name: Наборы на сервере
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # без каталога на сервере и без набора недели делать нечего — не ставить зависимости зря
      - name: Что делать
        id: what
        env:
          BASE: ${{ inputs.base }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # по расписанию — только если main ушёл вперёд от прошлого успешного запуска
          if [ "$EVENT" = "schedule" ]; then
            LAST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/content.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)"
            if [ "$LAST" = "$GITHUB_SHA" ]; then
              echo "main ${GITHUB_SHA:0:7} уже сверен прошлым запуском — делать нечего." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "run=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --max-time 30 "${V1}catalog.json" || true)"
          echo "каталог на сервере: HTTP $CODE"
          if [ "$BASE" = "true" ] || [ -f content/week.yaml ] || [ "$CODE" != "404" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Каталога на сервере нет и набора недели нет — сверять и выкладывать нечего." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.what.outputs.run == 'yes'
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: steps.what.outputs.run == 'yes'
        with:
          bun-version: 1.3.11
      - if: steps.what.outputs.run == 'yes'
        run: npm ci
      - name: Золотой тест и набор недели
        if: steps.what.outputs.run == 'yes'
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          BASE: ${{ inputs.base && '--base' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          bun tools/content/week.ts --released "$V1" $BASE --out dist/v1
          if [ -f dist/v1/week.md ]; then cat dist/v1/week.md >> "$GITHUB_STEP_SUMMARY"; fi
      # всё, что выложено, — одним коммитом без истории (как ветка vps): прежние наборы из ветки, новые
      # из dist/v1/packs (только добавляются: выложенный набор с другими байтами — ошибка), подпись,
      # каталог и скрипт свёртки счётчиков
      - name: Выкладка — ветка packs
        if: steps.what.outputs.run == 'yes' && hashFiles('dist/v1/catalog.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf packs-branch
          if git ls-remote --exit-code --heads "$REPO" packs >/dev/null 2>&1; then
            git clone -q --depth 1 --single-branch --branch packs "$REPO" packs-branch
            rm -rf packs-branch/.git
          fi
          mkdir -p packs-branch/v1/packs packs-branch/stats
          shopt -s nullglob
          for f in dist/v1/packs/*; do
            t="packs-branch/v1/packs/$(basename "$f")"
            if [ -e "$t" ]; then
              cmp -s "$f" "$t" || { echo "::error::набор $(basename "$f") уже выложен с другими байтами — выложенное не меняется"; exit 1; }
            else
              cp "$f" "$t"
            fi
          done
          cp dist/v1/catalog.json dist/v1/catalog.sig packs-branch/v1/
          cp server/stats/fold.ts packs-branch/stats/fold.ts
          cd packs-branch
          git init -q -b packs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Наборы: каталог из main ${GITHUB_SHA:0:7}"
          git push -q --force "$REPO" HEAD:refs/heads/packs
          echo "Ветка \`packs\`: $(ls v1/packs | wc -l) наборов, каталог из ${GITHUB_SHA:0:7}. Сервер заберёт её за 5 минут." >> "$GITHUB_STEP_SUMMARY"
      # сервер забирает ветку раз в 5 минут: сверка ждёт до 15 минут
      - name: Сверка с сайтом
        if: steps.what.outputs.run == 'yes' && hashFiles('dist/v1/catalog.json') != ''
        run: |
          set -uo pipefail
          for i in $(seq 1 30); do
            if bun tools/content/week.ts --verify "$V1" --out dist/v1 > verify.log 2>&1; then
              cat verify.log
              exit 0
            fi
            sleep 30
          done
          cat verify.log
          echo "::error::Сайт за 15 минут не отдал выложенное (${V1}): сервер забирает ветку packs — deploy/uzory в Nefeste/gornitsagames (sudo uzory-packs, журнал journalctl -u uzory-packs)."
          exit 1
      # прежний каталог — для отката: вернуть его и его подпись на место. Выкладка к этому шагу
      # уже прошла, поэтому без места под артефакты (docs/05-process.md, «Место под артефакты»)
      # запуск не краснеет: шаг помечается, копии у этого запуска нет.
      - uses: actions/upload-artifact@v4
        if: always() && steps.what.outputs.run == 'yes'
        continue-on-error: true
        with:
          name: catalog-${{ github.run_number }}
          path: |
            dist/v1/catalog.json
            dist/v1/catalog.sig
            dist/v1/previous-catalog.json
            dist/v1/previous-catalog.sig
            dist/v1/week.md
          if-no-files-found: ignore
