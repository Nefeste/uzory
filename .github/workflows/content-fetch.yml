# Исходники картинок (tools/content/fetch.ts): поиск кандидатов с лицензиями и скачивание
# исходников по карточкам. Нужен, потому что среда ассистента не видит Викисклад и
# Библиотеку Конгресса. Коммитит найденное и скачанное обратно в ту же ветку; коммит
# токеном Actions новых запусков не вызывает.
#
# Только руками: до merge Actions сами не запускаются (docs/05-process.md, «Автоматика»).
# Ассистент запускает его на своей ветке, когда добавил карточки (Run workflow → ветка);
# он ничего не собирает — только скачивает исходники.
#
# С вводом `vk` (адрес открытого альбома владельца) — другое: снимки альбома на отбор
# (tools/content/vk.ts) уходят архивом в черновик релиза, а не в ветку: репозиторий
# открытый, черновик видят только его владельцы. После отбора черновик удаляется.
name: Content fetch

on:
  workflow_dispatch:
    inputs:
      search:
        description: 'Искать кандидатов заново по content/wanted.yaml'
        type: boolean
        default: false
      vk:
        description: 'Альбом VK владельца на отбор (https://vk.com/album…_…) — в черновик релиза'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: content-fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Поиск и скачивание
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Зависимости (только sharp и yaml)
        run: |
          mkdir -p "$RUNNER_TEMP/deps" && cd "$RUNNER_TEMP/deps"
          echo '{"name":"fetch-deps","private":true}' > package.json
          bun add sharp@0.35.4 yaml@2
          echo "NODE_PATH=$RUNNER_TEMP/deps/node_modules" >> "$GITHUB_ENV"
      - name: Chromium для альбома VK
        if: inputs.vk != ''
        run: |
          cd "$RUNNER_TEMP/deps"
          bun add playwright@1.56.1
          node_modules/.bin/playwright install --with-deps chromium
      - name: Альбом VK — в черновик релиза
        if: inputs.vk != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VK: ${{ inputs.vk }}
          TAG: vk-review-${{ github.run_number }}
        # архив с debug/ уходит в черновик и когда снимков не нашлось: по нему чинится разбор
        run: |
          ln -s "$RUNNER_TEMP/deps/node_modules" node_modules
          CODE=0
          bun tools/content/vk.ts "$VK" "$RUNNER_TEMP/vk" || CODE=$?
          (cd "$RUNNER_TEMP/vk" && zip -qr "$RUNNER_TEMP/vk.zip" .) || exit 1
          ls -la "$RUNNER_TEMP/vk.zip"
          gh release create "$TAG" --draft --title "Снимки владельца на отбор (VK)" \
            --notes "Черновик для ассистента: снимки альбома на отбор для «Природы» и «Городов». Не публиковать; удаляется после отбора." \
            "$RUNNER_TEMP/vk.zip" || exit 1
          echo "Черновик релиза: $TAG" >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"
      # поиск — только по заказу: иначе каждый запуск переписывал бы candidates.json
      # новым порядком выдачи
      - name: Кандидаты
        if: inputs.vk == ''
        env:
          SEARCH: ${{ inputs.search }}
        run: |
          ln -s "$RUNNER_TEMP/deps/node_modules" node_modules
          if [ "$SEARCH" = "true" ] || [ ! -f content/candidates.json ]; then
            bun tools/content/fetch.ts search
          else
            echo "поиск не заказан — только исходники по карточкам"
          fi
      - name: Исходники по карточкам
        if: inputs.vk == ''
        run: bun tools/content/fetch.ts fetch
      - name: В ветку
        if: always() && inputs.vk == ''
        run: |
          rm -f node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then echo "нового нет"; exit 0; fi
          git commit -m "Исходники картинок: кандидаты и скачанные файлы (CI)"
          git push
