# Автослияние (устав студии, ADR 0018; docs/05-process.md, «Ветки»): PR сливается сам (squash),
# когда на нём метка «ревью: ок» (её ставит Ревьюер — другая сессия, не автор PR), проверка
# «Типы, линтер и тесты» (pr.yml) зелёная на одобренном коммите, других красных или незаконченных
# проверок нет и в PR нет путей владельца из .github/CODEOWNERS. PR с путями владельца сливает
# владелец. Метка одобряет коммит: бот пишет его хеш в PR, и слить можно только его. Новый
# коммит снимает метку и auto-merge — нужно новое ревью; снятая метка выключает auto-merge.
#
# Логика — в общем наборе студии (ADR студии 0022): Nefeste/gornitsa-kit, workflow
# automerge.yml. pull_request_target и workflow_run берут этот файл из main, CODEOWNERS тоже
# выгружается из main: PR не может переписать правила своего слияния, код PR не выгружается и
# не запускается. Слияние токеном Actions (GITHUB_TOKEN) не запускает workflow на push в main —
# поэтому после слияния ничего не должно ждать события push (docs/05-process.md).
name: Автослияние

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [PR]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: automerge-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automerge:
    if: ${{ github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request' }}
    uses: Nefeste/gornitsa-kit/.github/workflows/automerge.yml@v1
    with:
      check: 'Типы, линтер и тесты'
      label: 'ревью: ок'
    secrets:
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
