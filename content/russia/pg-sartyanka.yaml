id: pg-sartyanka
title: В синей парандже. Самарканд
collection: russia
order: 82
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
about: >
  Женщина в синей парандже стоит у деревянных ворот в глиняной стене. Подпись Прокудина-Горского —
  «Сартянка. Самарканд»: «сартами» называли оседлых жителей городов и оазисов Средней Азии. В
  Туркестанском крае этим словом пользовались до 1926 года, потом оно ушло и из документов, и из
  речи.
