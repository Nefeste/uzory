id: pg-chasovnya-petrozavodsk
title: Часовня Петра I в Петрозаводске
collection: russia
order: 87
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
about: >
  Снимок — из альбома видов вдоль Мурманской железной дороги, подпись фотографа: «Петрозаводск.
  Часовня, построенная Петром I». Сам город вырос при оружейном заводе: его начали строить по указу
  Петра 1 сентября 1703 года на берегу Онежского озера, а через год назвали Петровским.
