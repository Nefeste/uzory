about: >
  Церковь с колокольней снята в 1912 году в Тобольске: фотограф побывал здесь, снимая водные пути
  Урала и Западной Сибири. Город основан в 1587 году у впадения Тобола в Иртыш и с 1708 года был
  центром Сибирской губернии. В его нагорной части стоит кремль; других каменных кремлей в Сибири
  нет.
