about: >
  Гуниб — село в Дагестане на крутом склоне Гунибского плато, на высоте около 1500 метров. Дома
  стоят уступами, и между нижними и верхними постройками около 700 метров по высоте. На снимке —
  Нижний Гуниб, а над ним поднимается отвесный край плато.
