about: >
  Шлюз № 37 с плотиной поставили у порога Чёрная Гряда на Шексне, когда в 1890-х годах
  перестраивали Мариинскую систему — водный путь от Волги к Балтике. В июне 1896 года именно здесь
  торжественно открыли обновлённую систему. После перестройки путь по воде от Рыбинска до
  Петербурга занимал 31 день, а в 1810–1820-х годах — около 110 суток.
