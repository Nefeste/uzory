author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1910"
place: "Златоуст, Урал"
about: >
  Златоуст вырос из железоделательного завода, основанного в 1754 году; имя ему дала церковь
  Иоанна Златоуста, которую задумали построить владельцы. В 1815 году здесь открылась оружейная
  фабрика, мастеров для неё пригласили из Золингена и других городов Европы. Тогда же Златоуст
  стал центром гравюры на стали: сначала ею украшали клинки.
