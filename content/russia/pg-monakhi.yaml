id: pg-monakhi
title: Монахи за работой. Посадка картофеля
collection: russia
order: 45
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1910"
place: "Гефсиманский скит"
about: >
  Братия в традиционных монашеских одеждах сажает картофель на поле, расчищенном в густом хвойном
  лесу. Это Гефсиманский скит Ниловой пустыни на Селигере, недалеко от истоков Волги. Земледелием
  жил и отшельник Нил, в честь которого назван монастырь: по житию, он 27 лет один провёл на
  острове, сам выращивал себе еду, а рыбаки иногда привозили ему рыбу.
