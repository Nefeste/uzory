title: Церковь Иоанна Богослова на Ишне
collection: russia
order: 89
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1911"
about: >
  Деревянная церковь Иоанна Богослова стоит в селе Богослов на реке Ишне, в трёх километрах от
  Ростова Великого. Её построили в 1687 году на месте, где, по преданию, Иоанн Богослов явился
  Авраамию Ростовскому. Это самый старый деревянный храм Ярославской области; Прокудин-Горский снял
  его с юга в 1911 году.
