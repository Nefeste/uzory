title: Стрелочник-башкир
collection: russia
order: 41
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1910"
place: "Урал"
about: >
  Снимок сделан в 1910 году у города Усть-Катава на Урале, возле главного пути Транссибирской
  магистрали между Уфой и Челябинском. Стрелка нужна, чтобы поезд мог перейти с одного пути на
  другой, а ручные стрелки обслуживали особые работники — стрелочники. Стрелочник дежурил в будке
  возле стрелок и подавал сигналы, в том числе рожком.
