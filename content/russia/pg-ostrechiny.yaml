author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1909"
place: "Остречины на Свири"
about: >
  Двое людей с лодкой — этюд, снятый в 1909 году у Остречин на Свири. Возле Остречин река заметно
  сужалась, а Остречинские пороги делили её на два прохода; у камня Бурец судовой ход был шириной
  всего около десяти метров. Проводить суда через пороги помогали лоцманы — на Свири их было до
  400 человек.
