id: pg-granaty
title: В саду переселенца. Гранаты
collection: russia
order: 69
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
place: "Николаевка, Муганская степь"
about: >
  Снимок сделан в саду переселенца в селе Николаевка, в Муганской степи к югу от слияния Куры и
  Аракса. В альбоме кадр по ошибке подписан «Хлопок»: хлопок здесь и правда сеют на орошаемых
  землях, но снимали гранаты. В Закавказье они поспевают со второй половины сентября, а слово
  «гранат» восходит к латинскому granatus — «зернистый».
