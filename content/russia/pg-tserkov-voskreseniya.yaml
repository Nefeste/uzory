about: >
  Церковь стоит в Костроме на берегу Волги, на улице Нижняя Дебря: её название напоминает о густых
  зарослях, когда-то покрывавших низину у реки. Каменный храм построили в середине XVII века,
  главным жертвователем был купец Кирилл Исаков. По преданию, в одном из бочонков с краской,
  присланных ему из Англии, оказались золотые монеты, и купец решил потратить их на храм.
