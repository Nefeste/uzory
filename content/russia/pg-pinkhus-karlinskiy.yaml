title: Пинхус Карлинский, 84 года
collection: russia
order: 14
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1909"
about: >
  На снимке — надсмотрщик Черниговского водоспуска на Мариинской водной системе; он стоит у
  паромной пристани. Фотограф записал, что ему 84 года и 66 из них он на службе. Водоспуском
  называли проём в плотине или дамбе канала, через который при надобности спускали воду. Сам
  водный путь открыли в 1810 году, и он связал Волгу с Балтийским морем.
