author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1911"
place: "Владимир"
about: >
  Собор во Владимире сложен из белого камня в 1190-х годах при великом князе Всеволоде Большое
  Гнездо и посвящён святому Дмитрию Солунскому; фотограф снял его в 1911 году. Стены украшают
  около шестисот резных рельефов, среди них царь Давид с гуслями и улыбающиеся львы. По образцу
  этого собора построен собор Святого Николая в Вашингтоне.
