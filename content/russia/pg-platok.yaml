made: "1911"
about: >
  Старинный женский платок Прокудин-Горский снял в 1911 году в музее Ростова Великого. Ростовский
  музей церковных древностей открылся в 1883 году в Белой палате кремля, а в 1910 году
  Государственная дума закрепила за ним общероссийский статус.
