author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
place: "Чаква, близ Батума"
about: >
  Работницы собирают чай на холмистой плантации у Чаквы, на восточном берегу Чёрного моря.
  Фотограф записал их гречанками: греческие семьи жили в этих краях веками, некоторые — с античных
  и византийских времён. Чай тогда собирали руками, а для лучших сортов брали только верхние
  листья куста.
