title: Собор Рождества Богородицы
collection: russia
order: 47
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1912"
place: "Суздаль"
about: >
  Собор стоит в Суздальском кремле; на снимке 1912 года видны его луковичные главы. Нынешний храм
  построен в 1222–1225 годах при князе Юрии Всеволодовиче, а в XVI веке его верх переложили из
  кирпича, и из трёхглавого он стал пятиглавым. Западные и южные двери собора обиты медью с
  золотыми рисунками — они сделаны в первой трети XIII века.
