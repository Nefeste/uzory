author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1910"
about: >
  Красная скала — утёс высотой около 80 метров у станции Миньяр на Южном Урале, где река Миньяр
  впадает в Сим. В нём видны слои розово-красных глинистых пород, которым больше двух миллиардов
  лет; академик Владимир Обручев называл утёс «Красным камнем». Теперь это памятник природы.
