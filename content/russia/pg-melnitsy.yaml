about: >
  Деревянные ветряки сняты в 1912 году в разгар лета на равнине Западной Сибири, в Ялуторовском
  уезде Тобольской губернии; силой ветра они мололи пшеницу и рожь. Это мельницы-столбовки: весь
  корпус с крыльями держится на одном вертикальном столбе и поворачивается вокруг него, чтобы
  крылья встали навстречу ветру.
