stock: true   # в запас: с «да» — не в 1.0, а в наборы недели после выхода (issue 86)
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1910"
about: >
  Крестьянка в Пермской губернии мнёт лён на деревянной мялке, рядом лежат снопы. Из стеблей льна
  получают волокно для ткани и одежды. На Руси крестьяне возделывали лён на волокно и на масло уже в
  X–XI веках, а снимок сделан в 1910 году.
