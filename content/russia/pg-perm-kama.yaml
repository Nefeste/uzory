about: >
  На снимке — баржи на Каме и городские кварталы на берегу. Пермь выросла из медеплавильного
  завода, который начали строить в 1723 году у устья речки Егошихи, а городом стала в 1781 году.
  Кама считается левым притоком Волги, но учёные до сих пор спорят, не Волга ли на самом деле
  впадает в Каму.
