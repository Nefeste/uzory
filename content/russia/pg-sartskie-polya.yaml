about: >
  На снимке — поля и холмы под Самаркандом. Город окружали оазисы и пашни, которые кормили
  горожан: здесь растили дыни, пшеницу, бобы, рис и ячмень. Слово «сартские» в подписи устарело: в
  Туркестане того времени коренных жителей делили на оседлых «сартов» и кочевых «киргизов».
