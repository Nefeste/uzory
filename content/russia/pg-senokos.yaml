about: >
  Крестьяне ворошат граблями скошенную траву, а в сене сидит малыш. Косить начинали с рассветом,
  пока трава в росе: так коса идёт легче. Сено ворошили, чтобы лучше сохло, к вечеру сгребали в
  длинные валы и копны, а потом ставили стога. На луг наряжались в лучшее, как на праздник.
