id: pg-shkolniki
title: Школьники. Самарканд
collection: russia
order: 84
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
about: >
  Мальчики в полосатых халатах сидят на скамье у кирпичной стены вместе со взрослым в белой чалме.
  Подпись фотографа — «Школьники сарты. Самарканд»: «сартами» в Туркестане называли оседлых жителей
  городов и оазисов, и это слово было в ходу до 1926 года.
