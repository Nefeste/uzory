made: "1912"
about: >
  Троицкий монастырь стоит на высоком мысу над Турой; его основали в 1616 году, и это один из
  старейших монастырей Сибири. Каменную Троицкую церковь строили с 1708 по 1715 год, и по ней
  монастырь, прежде Спасо-Преображенский, получил новое имя. Снимок сделан в 1912 году.
