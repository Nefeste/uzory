id: pg-nilov-monastyr
title: Нилова пустынь на Селигере
collection: russia
order: 0
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1910"
about: >
  Монастырь снят с восточной стороны; он стоит на острове Столобном на Селигере, примерно в 10 км
  к северу от Осташкова. Отшельник Нил перебрался на остров в 1528 году: первую зиму провёл в
  землянке, а летом поставил деревянную келью и часовню. После его смерти рядом с могилой стали
  селиться другие отшельники, и в 1594 году здесь открыли монастырь.
