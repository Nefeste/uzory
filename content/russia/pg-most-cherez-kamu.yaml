id: pg-most-cherez-kamu
title: Мост через Каму
collection: russia
order: 75
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "около 1910"
place: "близ Перми"
about: >
  Этот мост на каменных опорах открыли в 1899 году, и он стал первым мостом через Каму. По нему
  пошли поезда новой дороги Пермь — Вятка — Котлас, которая вела к Северной Двине. В мосту длиной
  840 метров было десять пролётов, а железные фермы для них склепали из металла Воткинского
  завода.
