about: >
  Из пресных озёр Европы больше Онежского только Ладожское, а островов в нём около 1650. Штормы
  здесь часты, волны поднимаются до 3,5 метра, поэтому в XIX веке вдоль южного берега прорыли
  канал, чтобы малые речные суда обходили открытую воду. По подписи фотографа, на снимке 1909 года
  — место спасательной станции.
