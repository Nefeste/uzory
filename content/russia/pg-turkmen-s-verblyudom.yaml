title: Туркмен с верблюдом
collection: russia
order: 35
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
place: "Средняя Азия"
about: >
  Погонщик в красном халате и большой папахе из овчины — тельпеке — присел у верблюда,
  навьюченного мешками, вероятно, с зерном или хлопком. Тельпек туркмены носят издавна: он бережёт
  и от летнего зноя, и от зимнего холода. Голова верблюда на снимке в цветной кайме: цвета снимали
  тремя кадрами по очереди, а верблюд шевельнулся между ними.
