author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1909"
place: "село Пидьма на Свири"
about: >
  Шатровую деревянную церковь в Пидьме на Свири построили в 1696 году; её восьмигранный сруб
  поднимался прямо от земли. Название села выводят из вепсского «пидьм» — «затор»: дальше суда
  преодолевали свирские пороги по одному, а не караваном, и возле села собирались баржи и плоты.
  Жители села работали на Свири лоцманами и капитанами.
