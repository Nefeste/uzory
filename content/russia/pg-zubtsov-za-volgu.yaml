title: Зубцов. Вид за Волгу
collection: russia
order: 71
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1910"
place: "Зубцов, Тверская губерния"
about: >
  Зубцов стоит там, где в Волгу впадает Вазуза; на левом берегу Волги, напротив устья Вазузы,
  сохранилось городище древнего кремля. По сказке, записанной в Тверской губернии, Волга и Вазуза
  поспорили, кто скорее доберётся до моря, и Вазуза ночью тайком убежала вперёд. Но в Зубцове
  Волга её догнала, и Вазуза, назвавшись младшей сестрой, попросила отнести её к морю на руках.
