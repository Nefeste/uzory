about: >
  Перец краснеет на грядках огорода; где он рос, в подписи не сказано — снимок из альбома видов
  Кавказа и Черноморского побережья. Стручковый перец бывает сладким и острым, а родом он из
  Центральной Америки. Первое известие о нём относится к 1494 году: врач, плывший с Колумбом,
  записал, что индейцы зовут этот овощ «ахи» и приправляют им пищу вместо соли.
