author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1912"
place: "Тобольск"
about: >
  Тобольск основан в 1587 году там, где Тобол впадает в Иртыш, а с 1708 года официально считался
  столицей Сибири. Вид 1912 года снят с колокольни Преображенской церкви при духовной семинарии.
  Семинария выросла из школы, открытой в городе в 1703 году, — первого учебного заведения за
  Уралом, а с 1770 года размещалась в Знаменском монастыре.
