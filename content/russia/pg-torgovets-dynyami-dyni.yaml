author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
about: >
  Дыни на прилавке — местный урожай: на полях вокруг Самарканда их растили вместе с пшеницей,
  рисом и бобами. Средняя Азия считается одной из родин дыни, и уже в XV–XVI веках её отсюда
  привезли в Нижнее Поволжье. Дыни едят не только свежими: их вялят и сушат, варят из них дынный
  мёд и повидло.
