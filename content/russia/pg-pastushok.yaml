  download: https://tile.loc.gov/storage-services/service/pnp/ppem/01500/01541v.jpg
  basis: "Библиотека Конгресса США, собрание Прокудина-Горского: без известных ограничений на публикацию; автор ум. 1944 — в России срок истёк"
pattern:
