# «Россия в цвете», пачка 5 (16.10.2026): запас на «Новое» после 1.0 — набор недели берёт только
# новые картинки с «да». Цветная сборка Библиотеки Конгресса (ppem), а не негатив или альбомный
# отпечаток (prok); на отбор, без «да».
id: pg-pastushok
title: Пастушок на реке Сим
collection: russia
order: 78
stock: true   # в запас: с «да» — не в 1.0, а в наборы недели после выхода (issue 86)
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1910"
about: >
  Маленький пастушок сидит на склоне у реки Сим на Южном Урале; снимок сделан в 1910 году. Сим течёт
  по Челябинской области и Башкортостану и впадает в Белую, длина реки — 239 километров. Единого
  толкования названия нет: одна из версий связывает его с башкирским словом, означающим омут.
about_sources:
  - https://www.loc.gov/item/2018679563/
  - https://ru.wikipedia.org/wiki/Сим_(река)
source:
