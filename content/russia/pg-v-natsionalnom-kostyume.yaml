author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
about: >
  Девушка в красной юбке и синей кофте стоит на зелёном склоне. В альбоме Прокудина-Горского подпись
  — «Мугань. Грузинка в национальном костюме», а Библиотека Конгресса относит снимок к Артвину и
  называет девушку армянкой. Артвин стоит на реке Чорох; с 1878 года он входил в Российскую империю.
