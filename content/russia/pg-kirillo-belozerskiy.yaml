title: Кирилло-Белозерский монастырь
collection: russia
order: 19
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1909"
place: "Кириллов"
about: >
  Монастырь стоит на берегу Сиверского озера. Его история началась в 1397 году с пещеры, которую
  выкопал у воды монах Кирилл. Позже из монастырской слободы вырос город Кириллов. Обитель была
  большим книжным центром: к 1601 году в её библиотеке собралось больше тысячи рукописных и
  печатных книг.
