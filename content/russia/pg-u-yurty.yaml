id: pg-u-yurty
title: Женщина у юрты
collection: russia
order: 39
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
place: "Средняя Азия"
about: >
  Женщина в традиционном наряде с украшениями стоит в профиль на узорчатом ковре у входа в юрту.
  Кто она — туркменка, киргизка или узбечка, — в описаниях Библиотеки Конгресса сказано
  по-разному. Юрту из складных решётчатых стенок, крытых войлоком, одна семья могла собрать или
  разобрать примерно за час и перевезти на верблюдах или лошадях.
