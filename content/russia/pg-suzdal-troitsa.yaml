id: pg-suzdal-troitsa
title: Троицкая церковь Преподобенского монастыря
collection: russia
order: 90
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1912"
about: >
  Троицкий монастырь в Суздале основали в XIII веке рядом с Ризоположенским, по преданию — по
  завещанию преподобной Евфросиньи. Каменный Троицкий собор построили в конце XVII века, а в 1930-х
  годах его взорвали: снимок 1912 года сохранил его облик. От монастыря остались Святые ворота и
  угловая башня.
