title: На реке Скурисцхали. Этюд
collection: russia
order: 38
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
place: "Орто-Батум, близ Батума"
about: >
  На камне у горной реки сидит сам фотограф — в костюме и шляпе, позади горы. Долго считалось, что
  это река Каролисцхали, но по подписи в альбоме уточнили: это Скурисцхали у села Орто-Батум под
  Батумом. Прокудин-Горский был химиком, учеником Менделеева, и каждый цветной снимок делал тремя
  кадрами — через синий, зелёный и красный светофильтры.
