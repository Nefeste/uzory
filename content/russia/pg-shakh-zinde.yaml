title: Мечеть Шах-Зинде. Вечерний снимок
collection: russia
order: 57
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
place: "Самарканд"
about: >
  Вечерний вид на купола, за которыми поднимаются горы. В подписи Шахи-Зинда названа мечетью, но
  это ансамбль из одиннадцати мавзолеев, которые возводили один рядом с другим в XIV–XV веках;
  многие облицованы плиткой бирюзового и густо-синего цвета с цветочными узорами. С XVI века
  ансамбль зовут «живой царь»: так называют Кусама ибн Аббаса, двоюродного брата пророка
  Мухаммеда.
