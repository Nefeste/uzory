author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
about: >
  Мужчина в полосатом халате, старик с белой бородой и двое мальчиков в красном у глиняной стены.
  Подпись Прокудина-Горского — «Типы сартов. Самарканд»: «сартами» называли оседлых жителей городов
  и оазисов Средней Азии. Перепись 1897 года насчитала почти миллион человек, назвавших родным
  «сартовский» язык.
