id: pg-kurdskaya-semya
title: Курдская женщина с детьми
collection: russia
order: 80
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
about: >
  Курдская женщина с тремя детьми сидит на траве. Снимок сделан в Артвине — городе на реке Чорох,
  недалеко от нынешней границы Турции с Грузией. После войны 1877–1878 годов Артвин отошёл к
  Российской империи и вошёл в Батумскую область, а теперь это Турция.
