title: Озеро Стерж
collection: russia
order: 60
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1910"
place: "верхняя Волга, Тверская губерния"
about: >
  Здесь Волга впадает в Стерж — первое из Верхневолжских озёр на её пути, длиной 12 км. По
  рассказам старожилов, у впадения Волги в озеро на насыпном холме Городок стоял каменный крест.
  Надпись на нём сообщает, что в 1133 году новгородец Иванко Павлович начал «рыть реку» — учёные
  связывают это с работами на русле. Теперь крест хранится в Тверском музее.
