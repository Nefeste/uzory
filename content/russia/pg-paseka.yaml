id: pg-paseka
title: Крестьянская пасека близ Гагр
collection: russia
order: 86
stock: true   # в запас: с «да» — не в 1.0, а в наборы недели после выхода (issue 86)
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
about: >
  Красные ульи крестьянской пасеки стоят в саду близ Гагр, на Черноморском побережье Кавказа. Горы
  здесь подходят к самому морю и закрывают берег от холодных ветров, поэтому Гагра — одно из самых
  тёплых мест побережья. Курорт там открыл принц Ольденбургский в 1903 году.
