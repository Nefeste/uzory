about: >
  На снимке 1912 года — каменные церкви, деревянные дома и небольшой мостик через Каменку на краю
  Суздаля. Раскопки показали, что город вырос из поселения в излучине этой реки. Каменка длиной 47
  километров течёт через Суздаль и впадает в Нерль у села Кидекша.
