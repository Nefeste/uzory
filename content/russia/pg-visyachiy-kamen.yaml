title: Висячий камень на Чусовой
collection: russia
order: 21
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1912"
place: "река Чусовая, Урал"
about: >
  В альбоме фотографа этот снимок 1912 года подписан «Камень Бражкин», но позже исследователи
  установили, что на нём Висячий камень. Весной, в половодье, по Чусовой к Перми сплавляли барки с
  уральским металлом — их называли железными караванами. Особенно опасные для барок скалы прозвали
  бойцами.
