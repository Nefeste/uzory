id: pg-kamen-vysokiy
title: Камень Высокий на Чусовой
collection: russia
order: 20
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1912"
place: "река Чусовая, Урал"
about: >
  На Чусовой отвесные береговые скалы называют камнями, и у многих из них есть имена; эта, снятая
  в 1912 году, зовётся Высокий. Река рождается на восточном склоне Уральского хребта, пробивается
  сквозь него на запад и впадает в Каму чуть выше Перми. Камни поднимаются там, где Чусовая
  прорезает горные гряды.
