title: Бешеная балка
collection: russia
order: 62
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
place: "Кавказ"
about: >
  Бешеной балкой энциклопедия Брокгауза и Ефрона называет ущелье ручья Куро у села Казбек: в ливни
  и при таянии снегов поток сносит камни и глину, вода копится за запрудой, а потом прорывается к
  Тереку селем. Из-за этого дорогу перенесли на другой берег Терека. Каталог Библиотеки Конгресса
  относит снимок к Боржоми, так что где именно он сделан, точно неизвестно.
