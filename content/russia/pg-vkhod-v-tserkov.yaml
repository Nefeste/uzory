id: pg-vkhod-v-tserkov
title: Вход в церковь Воскресения
collection: russia
order: 33
author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1910"
place: "Кострома"
about: >
  Путь к храму лежит через Святые ворота середины XVII века — кирпичную арку с белокаменными
  деталями, широким проездом и узким проходом; над кровлей поднимаются три шатра-украшения с
  главками. На белокаменных розетках ворот вырезаны сказочные звери и птицы среди травного узора:
  единорог, лев, сирин. В середине XVIII века ворота соединили крытым переходом с западным
  крыльцом церкви.
