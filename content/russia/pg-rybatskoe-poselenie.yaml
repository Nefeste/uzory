about: >
  У берега рыбацкой деревни — лодки с рыбаками, а дальше развешаны для просушки сети. Селигер
  тянется с севера на юг примерно на 100 км и состоит из множества плёсов, связанных узкими
  протоками. В озере водится около 30 видов рыб; ловят здесь, например, леща, щуку, судака и
