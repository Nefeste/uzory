about: >
  Крестьянка прядёт у бревенчатой избы с крыльцом в деревне Изведово на верхней Волге. Пряли
  обычно всю осень и зиму, а в последний день Масленицы, празднуя конец прядения, женщины катались
  с ледяной горки на донцах — нижних досках прялок: верили, что чем дальше прокатишься, тем выше
  вырастет лён. Теперь Изведово — часть посёлка Пено в Тверской области.
