author: { name: Сергей Прокудин-Горский, life: 1863–1944 }
made: "1905–1915"
about: >
  Кувшинки сняты в Грузии, а в альбоме видов Кавказа и Черноморского побережья подпись к снимку
  вышла с опечаткой — «Водяные линии». Водяной лилией в народе зовут белую кувшинку. Латинское имя
  этих растений, Nymphaea, восходит к греческому слову «нимфа».
