about: >
  Монастырь стоит на острове в Белом море; первые монахи поселились здесь в 1429 году. В 1584–1594
  годах его обнесли стенами из огромных камней, некоторые размером до пяти метров. Стены высотой
  от 8 до 11 метров тянутся больше чем на километр, в них семь ворот и восемь башен.
