about: >
  Пожилой человек стоит на снегу под Самаркандом и держит связку пойманных птиц. Сартами в
  Туркестане тогда называли оседлых жителей оазисов — прежде всего узбеков, отчасти и таджиков;
  составители выставки Библиотеки Конгресса считают, что он, вероятно, таджик. В Самарканде и
  вокруг него жили узбеки, таджики, персы, арабы, а позже и русские.
