about: >
  Снимок сделан в 1910 году в башкирской деревне Яхъя, которая сейчас входит в Салаватский район
  Башкортостана; в дневнике фотографа она записана как Ехья. Уже в наше время родственники узнали
  на фотографии Фархиназ Бурханову, которая стоит на ступеньках своего дома. Она занималась
  кузнечным делом и любила делать медные украшения: кольца, броши и браслеты.
