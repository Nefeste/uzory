# «Цветы» (docs/09-content.md, §1): пунктирная гравюра Шапюи с раскраской от руки из «Роз» по рисунку П.-Ж. Редуте — подпись на листе (музей называет художником брата, Анри-Жозефа). Оригинал — в Кливлендском музее искусств;
