# «Цветы» (docs/09-content.md, §1): офорт с раскраской от руки из «Собрания роз с натуры» Мэри Лоуренс; подпись на листе — «Rosa semperflorens. Dark China Rose». Оригинал — в Кливлендском музее искусств;
