# «Цветы» (docs/09-content.md, §1): акватинта Р. Хэвелла с раскраской из «Избранных шеститычинковых растений»; подпись на листе — «Drawn by Mrs. E. Bury, Liverpool» (музей называет художником гравёра, Хэвелла). Оригинал — в Кливлендском музее искусств;
