# «Цветы» (docs/09-content.md, §1): пунктирная гравюра де Гуи с раскраской от руки из «Лилейных» по рисунку П.-Ж. Редуте — подпись на листе (музей называет художником брата, Анри-Жозефа). Оригинал — в Кливлендском музее искусств;
# изображение — открытый доступ музея (CC0). Пачка 6 — к календарю 1.0 (issue 105); в выпуск — после «да» владельца (В19).
