# «Цветы» (docs/09-content.md, §1): акватинта и пунктир (печать в цвете, раскраска от руки) из «Британской помоны» Брукшоу, таблица XXXIII; подпись на листе — «Painted & Published by the Author G. Brookshaw». Оригинал — в Кливлендском музее искусств;
# изображение — открытый доступ музея (CC0). Пачка 7 — к календарю 1.0 (issue 105); в выпуск — после «да» владельца (В19).
