# «Цветы» (docs/09-content.md, §1): пунктирная гравюра с раскраской от руки из «Избранных цветов и плодов» по рисунку П.-Ж. Редуте — подпись на листе (музей называет художником брата, Анри-Жозефа). Оригинал — в Кливлендском музее искусств;
# изображение — открытый доступ музея (CC0). Пачка 5 — запас для календаря после 1.0; в выпуск — после «да» владельца (В19).
