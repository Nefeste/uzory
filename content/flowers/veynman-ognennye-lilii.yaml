# «Цветы» (docs/09-content.md, §1): раскрашенная гравюра из «Phytanthoza iconographia» Вейнмана, таблица 655 (музей называет издателя; художник на листе не подписан); на листе — латинские и немецкие названия трёх лилий. Оригинал — в Кливлендском музее искусств;
# изображение — открытый доступ музея (CC0). Пачка 7 — к календарю 1.0 (issue 105); в выпуск — после «да» владельца (В19).
id: veynman-ognennye-lilii
v: 2   # сглаживание 1, крупнее, картинка дня — пересборка по issue 121; v1 — в was
title: Огненные лилии
collection: flowers
order: 90
author: { name: Иоганн Вильгельм Вейнман, life: 1683–1741 }
made: "1737–1745"
place: "Кливлендский музей искусств, США"
museum: abroad
source:
  file: veynman-ognennye-lilii.jpg
  url: https://clevelandart.org/art/1955.338
  download: https://openaccess-cdn.clevelandart.org/1955.338/1955.338_web.jpg
  basis: "Кливлендский музей искусств, открытый доступ (Open Access, CC0); издатель ум. 1741, издание 1737–1745 годов"
pattern:
  crop: [0.02, 0.05, 0.98, 0.88]   # без номера и подписей внизу
  size: 112   # наибольший, при котором лист — картинка дня (issue 121)
  threads: 16
  smooth: 1   # сглаживание: чистка с охраной — окна, лица и тонкие стебли остаются (issue 121)
