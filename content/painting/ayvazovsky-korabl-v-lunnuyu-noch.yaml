about: >
  Ночное море, луна и корабль уместились на совсем небольшом холсте — около 16 на 24 сантиметров;
  точная дата картины неизвестна. Море Айвазовский писал по памяти, а не с натуры, и опирался при
  этом на схематичные зарисовки. В Метрополитен-музей картина поступила по завещанию в 1975 году.
