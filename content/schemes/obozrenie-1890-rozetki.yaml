# Старинная схема для вышивки (разведка альбомов, 29.09.2026): лист «Образцы работ шелками
# и шерстями по канве (с выдергиванием ниток)» — приложение к журналу «Живописное обозрение»,
# Санкт-Петербург; «Дозволено цензурою 15 сентября 1889 года», типолитография С. Добродеева.
# На листе несколько узоров на одной сетке; здесь — розетки между волнами, лист справа ниже середины.
id: obozrenie-1890-rozetki
title: Розетки и волна
collection: schemes
order: 10
author: { name: "неизвестный художник, журнал «Живописное обозрение»" }
made: "1889"
place: "журнал «Живописное обозрение», 1890, приложение (скан на Викискладе)"
museum: none
source:
  file: obozrenie-1890-kanva.jpg
  url: https://commons.wikimedia.org/wiki/File:Живописное_обозрение_1890,_№_01-26_(1_янв._-_24_июня);_№_27-52_(1_июля_-_23_дек.)_Page_0052.jpg
  basis: "Викисклад: PD-RusEmpire, PD-Russia; скан Российской национальной библиотеки; работа без имени автора, выпущена в 1889–1890 годах — общественное достояние по сроку (70 лет после выпуска)"
pattern:
  chart: [0.497, 0.472, 0.935, 0.668]   # фрагмент листа: рамка чуть шире узора, линии сборка находит сама
  cells: [63, 41]
  size: 63
  inset: 0.25      # цвет — середина клетки без линий сетки
  threads: 5
  canvas: "#c1ad83"      # бумага схемы — фон, не вышивается
  white_paper: true   # лист был белым, скан пожелтел: цвета — как на белой бумаге
  exact: true   # печать ровными красками: шахматка и точки — замысел
