# Санкт-Петербург; «Дозволено цензурою 15 сентября 1889 года», типолитография С. Добродеева.
# На листе несколько узоров на одной сетке; здесь — кайма со звёздами и цветами, лист вверху слева.
id: obozrenie-1890-tsvety
title: Звёзды и цветы
