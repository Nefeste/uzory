# Старинная схема для вышивки (разведка альбомов, 29.09.2026), раскрашенная по клеткам;
# на листе — «P. Trübe in Berlin».
id: berlin-shpits
title: Шпиц на подушке
collection: schemes
order: 1
author: { name: "неизвестный художник, Берлин" }
made: "около 1850"
place: "Купер-Хьюитт, Смитсоновский музей дизайна, Нью-Йорк (18434271)"
museum: abroad
source:
  file: berlin-shpits.jpg
  url: https://commons.wikimedia.org/wiki/File:Print,_Design_for_Berlin_Wool_Work,_Spitz,_ca._1850_(CH_18434271).jpg
  basis: "Викисклад: Public domain; музей Купер-Хьюитт (Смитсоновский институт), открытый доступ CC0; работа около 1850 года — общественное достояние по сроку"
pattern:
  chart: [0.2755, 0.2225, 0.7405, 0.7475]   # рамка чуть шире сетки; линии сборка находит сама, поле отрезает
  cells: [120, 90]
  size: 120
  inset: 0.25      # цвет — середина клетки без линий сетки
  threads: 24
  canvas: "#a4b8cf"      # бумага схемы — фон, не вышивается
approved: 2026-10-03
