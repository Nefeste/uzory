# Старинная схема для вышивки (разведка альбомов, 29.09.2026), раскрашенная по клеткам;
# на листе — «Berlin bei L. W. Wittich», номер 737: кайма из листьев аканта.
id: berlin-kayma-akant
v: 2   # белые точки посреди рисунка — краска (15.10.2026, по слову владельца); v1 — в was
title: Кайма с акантом
collection: schemes
order: 6
author: { name: "неизвестный художник, издательство Виттиха в Берлине" }
made: "около 1860"
place: "Купер-Хьюитт, Смитсоновский музей дизайна, Нью-Йорк (18605279)"
museum: abroad
source:
  file: berlin-kayma-akant.jpg
  url: https://commons.wikimedia.org/wiki/File:Drawing,_Design_for_Berlin_Wool_Work,_ca._1860_(CH_18605279).jpg
  basis: "Викисклад: PD-Art (PD-old-100); музей Купер-Хьюитт (Смитсоновский институт), открытый доступ CC0; работа около 1860 года — общественное достояние по сроку"
pattern:
  chart: [0.137, 0.207, 0.848, 0.834]   # рамка чуть шире сетки; линии сборка находит сама, поле отрезает
  cells: [200, 80]
  size: 200
  inset: 0.25      # цвет — середина клетки без линий сетки
  threads: 24
  canvas: "#ebe3ce"      # бумага схемы — фон, не вышивается
  canvas_seed: 0.1     # образцы бумаги — близкие к ней: прозрачная краска не сходит за бумагу
  canvas_holes: 6     # бумага посреди рисунка до 6 клеток — краска, не «белые точки»
was:
  1: { canvas_seed: 0.2, canvas_holes: 0 }   # узор, вышедший в APK, — для начатых на нём работ
approved: 2026-10-03
