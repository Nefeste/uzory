# Старинная схема для вышивки (разведка альбомов, 29.09.2026), раскрашенная по клеткам;
# на листе — «Heinrich Kuehn, Berlin», медали 1873–1879.
id: berlin-sobaka
v: 2   # белые точки посреди рисунка — краска (15.10.2026); v1 — в was
title: Охотничья собака
collection: schemes
order: 2
author: { name: "неизвестный художник, Берлин" }
made: "около 1879"
place: "Купер-Хьюитт, Смитсоновский музей дизайна, Нью-Йорк (18398471)"
museum: abroad
source:
  file: berlin-sobaka.jpg
  url: https://commons.wikimedia.org/wiki/File:Print,_Berlin_Wool_Work-_Hunting_Dog,_ca._1879_(CH_18398471).jpg
  basis: "Викисклад: Public domain; музей Купер-Хьюитт (Смитсоновский институт), открытый доступ CC0; работа около 1879 года — общественное достояние по сроку"
pattern:
  chart: [0.152, 0.218, 0.831, 0.841]   # рамка чуть шире сетки; линии сборка находит сама, поле отрезает
  cells: [129, 90]
  size: 129
  inset: 0.25      # цвет — середина клетки без линий сетки
  threads: 22
  canvas: "#a2aeb8"      # бумага схемы — фон, не вышивается
  canvas_seed: 0.1     # образцы бумаги — близкие к ней: прозрачная краска не сходит за бумагу
  canvas_holes: 12    # бумага посреди рисунка до 12 клеток — краска, не «белые точки»
was:
  1: { canvas_seed: 0.2, canvas_holes: 0 }   # узор, вышедший в APK, — для начатых на нём работ
approved: 2026-10-03
