# Старинная схема для вышивки (разведка альбомов, 29.09.2026), раскрашенная по клеткам;
# по описанию музея — для подушечки для булавок.
id: berlin-girlyanda-roz
v: 2   # белые точки посреди рисунка — краска (15.10.2026); v1 — в was
title: Розы
collection: schemes
order: 3
author: { name: "неизвестный художник" }
made: "около 1860"
place: "Купер-Хьюитт, Смитсоновский музей дизайна, Нью-Йорк (18606875)"
museum: abroad
source:
  file: berlin-girlyanda-roz.jpg
  url: https://commons.wikimedia.org/wiki/File:Drawing,_Design_for_Berlin_Wool_Work,_ca._1860_(CH_18606875).jpg
  basis: "Викисклад: Public domain; музей Купер-Хьюитт (Смитсоновский институт), открытый доступ CC0; работа около 1860 года — общественное достояние по сроку"
pattern:
  chart: [0.112, 0.38, 0.9255, 0.979]   # рамка чуть шире сетки; линии сборка находит сама, поле отрезает
  cells: [148, 51]
  size: 148
  inset: 0.25      # цвет — середина клетки без линий сетки
  threads: 16
  canvas: "#d3c8ad"      # бумага схемы — фон, не вышивается
  canvas_seed: 0.1     # образцы бумаги — близкие к ней: прозрачная краска не сходит за бумагу
  canvas_holes: 6     # бумага посреди рисунка до 6 клеток — краска, не «белые точки»
was:
  1: { canvas_seed: 0.2, canvas_holes: 0 }   # узор, вышедший в APK, — для начатых на нём работ
approved: 2026-10-03
